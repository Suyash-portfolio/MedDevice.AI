{% extends "base.html" %}
{% block title %}Secure Access | MedDevice.AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="glass-card rounded-2xl p-8 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-white">Sign in to continue</h1>
            <p class="text-sm text-slate-400">Use the secure portal to access the dashboard and profile views.</p>
        </div>
        <div id="auth-message" class="rounded-xl border border-white/10 bg-white/5 p-4 text-sm text-slate-300"></div>
        <form id="login-form" class="space-y-3">
            <input id="login-email" type="email" required placeholder="Email address" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500/50 transition">
            <input id="login-password" type="password" required placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500/50 transition">
            <button id="login-submit" type="submit" class="w-full px-4 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-white transition">Sign In</button>
        </form>
        <div class="text-center text-xs uppercase tracking-wider text-slate-500">or</div>
        <form id="signup-form" class="space-y-3">
            <input id="signup-email" type="email" required placeholder="Email address" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500/50 transition">
            <input id="signup-password" type="password" required placeholder="Create password" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500/50 transition">
            <button id="signup-submit" type="submit" class="w-full px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 font-semibold text-slate-200 transition">Create Account</button>
        </form>
        <a href="/dashboard" class="block text-center px-4 py-3 rounded-xl bg-transparent border border-white/10 hover:bg-white/10 font-semibold text-slate-300 transition">
            Continue as Guest
        </a>
    </div>
</div>
{% endblock %}
