<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Medical Device Assistant{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gradient-to-tr from-slate-900 via-slate-800 to-indigo-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Global App Header Wrapper -->
    <nav class="sticky top-0 z-50 glass-nav border-b border-white/10 px-6 py-4 transition-all duration-300">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- Brand Space -->
            <a href="/" class="flex items-center gap-2 font-bold text-xl tracking-tight bg-gradient-to-r from-teal-400 to-indigo-400 bg-clip-text text-transparent hover:opacity-90 transition">
                <span>🛡️</span> MedDevice.AI
            </a>

            <!-- Desktop Navigation Links -->
            <div class="hidden md:flex items-center gap-6 text-sm font-medium">
                <a href="/" class="text-slate-300 hover:text-white transition">Home</a>
                <a href="/about" class="text-slate-300 hover:text-white transition">About</a>
                <a href="/devices" class="text-slate-300 hover:text-white transition">Devices</a>
                <a href="/dashboard" class="text-slate-300 hover:text-white transition">AI Assistant</a>
                <a href="/contact" class="text-slate-300 hover:text-white transition">Contact</a>
                <a href="/profile" id="nav-profile-link" class="text-slate-300 hover:text-white transition hidden">Device Hub</a>
                <a href="/user" id="nav-user-link" class="text-slate-300 hover:text-white transition hidden">My Dashboard</a>
            </div>

            <!-- Mobile Hamburger -->
            <button id="mobile-menu-btn" class="md:hidden text-slate-300 hover:text-white p-2">
                <svg id="hamburger-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                <svg id="close-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>

            <!-- Auth Controls -->
            <div class="hidden md:flex items-center gap-4">
                <span id="user-display-name" class="text-xs text-slate-400 hidden md:inline-block bg-white/5 px-3 py-1.5 rounded-full border border-white/10"></span>
                <a href="/login" id="nav-auth-btn" class="glass-btn text-xs font-semibold px-4 py-2 rounded-lg text-slate-200 hover:text-white transition">
                    Sign In
                </a>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden mt-4 pt-4 border-t border-white/10 space-y-2">
            <a href="/" class="block px-4 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition">Home</a>
            <a href="/about" class="block px-4 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition">About</a>
            <a href="/devices" class="block px-4 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition">Devices</a>
            <a href="/dashboard" class="block px-4 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition">AI Assistant</a>
            <a href="/contact" class="block px-4 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition">Contact</a>
            <a href="/profile" id="mobile-nav-profile-link" class="block px-4 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition hidden">Device Hub</a>
            <a href="/user" id="mobile-nav-user-link" class="block px-4 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition hidden">My Dashboard</a>
            <a href="/login" id="mobile-nav-auth-btn" class="block px-4 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition">Sign In</a>
            <span id="mobile-user-display" class="block px-4 py-2 text-xs text-slate-500 hidden"></span>
        </div>
    </nav>

    <!-- Main Dynamic Application Content Slot -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 lg:p-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Persistent Chat Overlay Targets -->
    <div id="global-chatbot-root" class="fixed bottom-6 right-6 z-50 pointer-events-none"></div>

    <!-- Core Initialization Context Tools -->
    <script>
        window.__SUPABASE_CONFIG__ = {
            url: {{ supabase_config.url|tojson }},
            anonKey: {{ supabase_config.anonKey|tojson }}
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
